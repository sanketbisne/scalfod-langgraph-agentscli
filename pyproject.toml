[project]
name = "scalfod-langgraph-agentscli"
version = "0.1.0"
description = "DeepCite: Iterative Research & Critique LangChain/LangGraph Agent powered by the Google Agents CLI Extension System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-google-genai>=2.1.0",
    "google-auth>=2.35.0",
    "google-cloud-aiplatform[evaluation]>=1.75.0",
    "google-cloud-logging>=3.11.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.1.70",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
